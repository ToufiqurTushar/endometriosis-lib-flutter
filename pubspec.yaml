name: endometriosis_lib_flutter
description: "Endometriosis_lib_flutter plugin project."
publish_to: 'none'
version: 0.0.1
homepage:

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  flutter_rapid:
    git:
      url: https://github.com/banglafighter/flutter_rapid.git
      ref: dev
      path: flutter_rapid
  flutter_form_builder: 10.0.1
  form_builder_validators: 11.2.0
  intl: ^0.20.0
  flutter_cupertino_date_picker_fork: ^1.0.7
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.1.3
  fluttertoast: ^9.0.0
  syncfusion_flutter_pdfviewer: ^31.1.21
  chucker_flutter: ^1.9.2
  dio: ^5.9.2

dependency_overrides:


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/images/endometriosis/
    - assets/pdf/

  plugin:
    platforms:
      android:
        package: com.cmedhealth.endometriosis_lib_flutter
        pluginClass: EndometriosisLibFlutterPlugin
      ios:
        pluginClass: EndometriosisLibFlutterPlugin
